name: Update TV guide

on:
  schedule:
    - cron: "30 5 * * *"   # every day after xmltvfr.fr refreshes its guide
    - cron: "30 15 * * *"  # and once more in the afternoon
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python build_tv.py
      - name: Commit tv.json
        run: |
          git config user.name "game-on-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tv.json
          git diff --cached --quiet || git commit -m "Update TV guide"
          git push
